# How to run each method's script.
#   mode: "local" runs each base method script directly as a local subprocess
#         (no cluster needed).
#   mode: "lsf" (original behavior) routes through the *_auto-script.py launchers
#         below, which submit bsub jobs via bash_scripts/<method>.sh. Requires
#         bsub/bjobs on PATH (an LSF cluster).
execution:
  mode: "local"

# Constants (only used when execution.mode is "lsf")
constants:
  univar_script_path: "python_main_cell_type_spec_method/univar_association_testing_auto-script.py"
  enet_script_path: "python_main_cell_type_spec_method/elastic_kfold_ver2_auto-script.py"
  rf_script_path: "python_main_cell_type_spec_method/tree_based_methods_auto-script.py"
  stab_sele_script_path: "python_main_cell_type_spec_method/stability_analyses_auto-script.py"


# General inputs
inputs:
  atlas_smal_path: "tutorial/human_protein_atlas_seismic_cell_spec_matrix.tsv"
  
  # The final full save path will be pipeline_results/pipeline_univar_multivar_sample_run
  save_path: "tutorial/pipeline_univar_multivar"
  save_path_suffix: "sample_run"
  
  # The full path to the sumstats dir is $disease_prot_dir/$disease_folder_name
  # disease_name can either be one of the diseases in disease_prot_dir (e.g. Alcoholic_liver_disease)
  # or there is a special keyword called "all" where all diseases will be run in a loop
  disease_prot_dir: "tutorial"
  disease_folder_name: "sample_disease"
  disease_name:
    - all


# Univariate regression specific params
univariate:
  covar_df: "None"
  covar_gini: 0
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1

  # Permutation test (0 = off). Adds pval_perm_one_side / fdr_perm_one_side and the
  # family-wise pval_maxT_one_side columns to univar_regression_results.tsv.
  # ~1 s per 1000 permutations for 1800 proteins x 230 cell types.
  n_perm: 2000
  perm_seed: 0
  # Stratify the permutation null by quantile bins of a covariate (needs a covariate).
  # Set perm_n_strata > 1 and perm_strata_col to a covariate column, e.g. "pleiotropy".
  perm_n_strata: 1
  perm_strata_col: "None"

  # Per-protein pleiotropy score from ALL diseases in the sumstats folder (leave-one-chapter-out),
  # used as a per-disease covariate and, if perm_n_strata > 1, as the permutation strata.
  # Off in the tutorial: with a single disease there is nothing to compute it from.
  pleiotropy:
    run: 0
    save_dir: null            # default: <save_path>/<disease_folder_name>/pleiotropy_scores
    score: "mean_z"           # or "mean_abs_z"
    exclude_same_category: 1

# Transition
univar_to_multivar:
  column_to_choose: "fdr_one_side_predictor"   # try "pval_maxT_one_side" for a stricter, family-wise gate
  thres: 0.05

# Cross-disease summary (run once after all diseases): flags cell types that are significant
# for most diseases as "generic" and reports disease-specific hits. Needs many diseases;
# off in the single-disease tutorial.
cross_disease:
  run: 0
  sig_col: "fdr_one_side_predictor"
  thres: 0.05
  generic_frac: 0.5
  min_diseases: 20


# ElasticNet
elasticnet_kfold:
  run: 1    # If run set to 1, then run elasticnet_kfold
  num_alpha: 100
  num_folds: 10
  gene_weight: 0
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1
  pos_coef: 0


# Random forest
random_forest:
  run: 1
  param_search: 1
  num_trees: 1000
  min_samples_split: 10
  min_samples_leaf: 2
  max_samples: 0.7

  kfold_n: 5
  n_permute_repeat: 30
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1


# Stability selection
stability_selection:
  run: 1
  samp_method: "subsampling_diff_size"
  optim_alpha_mode: "kneedle"
  thres: 0.6
  abs_hr: 0
  output_label: "z_score"
  ztransform_type: -1