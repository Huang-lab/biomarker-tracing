name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip pandas numpy scipy pytest pyyaml \
            scikit-learn statsmodels matplotlib seaborn kneed
          # Not on PyPI, and its setup.py imports numpy, so install it after numpy without build isolation
          python -m pip install --no-build-isolation git+https://github.com/scikit-learn-contrib/stability-selection.git

      - name: Run tests
        run: python -m pytest tests/ -v
